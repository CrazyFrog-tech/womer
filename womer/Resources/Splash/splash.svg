<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
	<!-- Background -->
	<rect width="1080" height="1920" fill="#121212"/>

	<!-- Center group -->
	<g transform="translate(540,860)">

		<!-- Stopwatch ring -->
		<circle cx="0" cy="0" r="220"
				fill="#1E1E1E"
				stroke="#e1d816"
				stroke-width="32"/>

		<!-- Top button -->
		<rect x="-70" y="-310" width="140" height="80" rx="24" fill="#e1d816"/>

		<!-- Dumbbell -->
		<!-- Left -->
		<rect x="-140" y="-40" width="40" height="120" rx="10" fill="#e1d816"/>
		<rect x="-90" y="-20" width="30" height="80" rx="8" fill="#e1d816"/>

		<!-- Handle -->
		<rect x="-60" y="-12" width="120" height="24" rx="12" fill="#e1d816"/>

		<!-- Right -->
		<rect x="60" y="-20" width="30" height="80" rx="8" fill="#e1d816"/>
		<rect x="100" y="-40" width="40" height="120" rx="10" fill="#e1d816"/>

	</g>

	<!-- App name -->
	<text x="540" y="1250"
		  text-anchor="middle"
		  font-family="Arial, Helvetica, sans-serif"
		  font-size="120"
		  fill="#e1d816"
		  letter-spacing="4">
		WOMER
	</text>
</svg>